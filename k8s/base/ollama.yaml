# Local LLM server. Models are stored on a PersistentVolume so they download only once.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: ollama-models
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests: { storage: 10Gi }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ollama
spec:
  replicas: 1
  strategy: { type: Recreate }   # RWO volume cannot be shared by two pods
  selector:
    matchLabels: { app: ollama }
  template:
    metadata:
      labels: { app: ollama }
    spec:
      enableServiceLinks: false
      containers:
        - name: ollama
          image: ollama/ollama:latest
          ports: [{ name: http, containerPort: 11434 }]
          env:
            - { name: OLLAMA_KEEP_ALIVE, value: "24h" }   # keep the model loaded in memory
          resources:
            requests: { cpu: 500m, memory: 2Gi }
            limits: { memory: 6Gi }
          readinessProbe:
            httpGet: { path: /api/tags, port: http }
            periodSeconds: 10
          volumeMounts:
            - { name: models, mountPath: /root/.ollama }
      volumes:
        - name: models
          persistentVolumeClaim: { claimName: ollama-models }
---
apiVersion: v1
kind: Service
metadata:
  name: ollama
spec:
  selector: { app: ollama }
  ports: [{ name: http, port: 11434, targetPort: http }]

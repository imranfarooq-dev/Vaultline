# Kafka consumer. Scale freely: pods in the same consumer group share partitions
# (3 partitions per topic => more than 3 workers would sit idle).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: banking-worker
spec:
  replicas: 1
  selector:
    matchLabels: { app: banking-worker }
  template:
    metadata:
      labels: { app: banking-worker }
    spec:
      enableServiceLinks: false
      terminationGracePeriodSeconds: 30
      securityContext: { runAsNonRoot: true, runAsUser: 1000 }
      containers:
        - name: worker
          image: banking-api
          imagePullPolicy: IfNotPresent
          ports: [{ name: http, containerPort: 3001 }]
          env:
            - { name: APP_MODE, value: worker }
            - { name: PORT, value: "3001" }
          envFrom:
            - configMapRef: { name: banking-config }
            - secretRef: { name: banking-secrets }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: [ALL] }
          resources:
            requests: { cpu: 50m, memory: 192Mi }
            limits: { memory: 384Mi }
          livenessProbe:
            httpGet: { path: /api/health/live, port: http }
            initialDelaySeconds: 20
            periodSeconds: 15
          readinessProbe:
            httpGet: { path: /api/health/ready, port: http }
            periodSeconds: 10

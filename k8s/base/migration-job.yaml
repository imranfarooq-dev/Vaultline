# Runs database migrations ONCE per deploy, before the API rolls out.
# Jobs are immutable: delete the old one before applying a new image
#   kubectl -n banking delete job banking-migrate --ignore-not-found
apiVersion: batch/v1
kind: Job
metadata:
  name: banking-migrate
spec:
  backoffLimit: 6
  ttlSecondsAfterFinished: 86400
  template:
    metadata:
      labels: { app: banking-migrate }
    spec:
      restartPolicy: OnFailure
      enableServiceLinks: false
      securityContext: { runAsNonRoot: true, runAsUser: 1000 }
      containers:
        - name: migrate
          image: banking-api
          imagePullPolicy: IfNotPresent
          command: ["node", "dist/database/run-migrations.js"]
          envFrom:
            - configMapRef: { name: banking-config }
            - secretRef: { name: banking-secrets }
          resources:
            requests: { cpu: 50m, memory: 128Mi }
            limits: { memory: 256Mi }

# Continuous Integration: every push and pull request.
name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fast-tests:
    name: Typecheck, unit & contract tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run lint
      - run: npx tsc --noEmit -p tsconfig.test.json
      - run: npm run test:cov
      - uses: actions/upload-artifact@v4
        with: { name: coverage, path: coverage }

  container-tests:
    name: Integration & e2e (Testcontainers)
    runs-on: ubuntu-latest   # GitHub runners have Docker, so Testcontainers just works
    needs: fast-tests
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run test:integration
      - run: npm run test:e2e

  docker:
    name: Build image
    runs-on: ubuntu-latest
    needs: fast-tests
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          target: runtime
          push: false
          tags: nestbank/banking-api:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

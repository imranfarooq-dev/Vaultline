# =============================================================================
# NestBank - full local platform
#
#   docker compose up -d --build          start everything
#   docker compose logs -f api worker     watch the app
#   docker compose run --rm smoke         walk through all 23 patterns
#   docker compose --profile test run --rm tests       run test suites in Docker
#   docker compose --profile loadtest run --rm k6      load test
#   docker compose down -v                stop and delete all data
#
# URLs:  API http://localhost:3000/api   Swagger http://localhost:3000/docs
#        Kafka UI http://localhost:8080  Ollama http://localhost:11434
# =============================================================================
name: nestbank

x-app-env: &app-env
  NODE_ENV: production
  LOG_FORMAT: pretty
  DB_HOST: postgres
  DB_PORT: 5432
  DB_USER: bank
  DB_PASSWORD: bank_password
  DB_NAME: bank
  DB_RUN_MIGRATIONS: "false"   # the one-shot "migrate" service does it
  KAFKA_ENABLED: "true"
  KAFKA_BROKERS: kafka:9092
  KAFKA_REPLICATION_FACTOR: 1
  AI_PROVIDER: ollama
  OLLAMA_BASE_URL: http://ollama:11434
  OLLAMA_CHAT_MODEL: ${OLLAMA_CHAT_MODEL:-llama3.2:1b}
  OLLAMA_EMBEDDING_MODEL: ${OLLAMA_EMBEDDING_MODEL:-nomic-embed-text}
  INTERNAL_TRANSFER_FEE_MINOR: 0
  FRAUD_RULES: "amount > 5000000 AND channel == 'mobile';hour < 5 AND amount > 1000000"

services:
  # ---------------------------------------------------------------- data
  postgres:
    image: pgvector/pgvector:pg16          # PostgreSQL 16 + the vector extension for RAG
    environment:
      POSTGRES_USER: bank
      POSTGRES_PASSWORD: bank_password
      POSTGRES_DB: bank
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bank -d bank"]
      interval: 5s
      timeout: 3s
      retries: 20

  kafka:
    image: apache/kafka:3.9.0              # KRaft mode: no ZooKeeper needed
    ports: ["29092:29092"]                 # for tools on your laptop
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093,PLAINTEXT_HOST://:29092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 3
    volumes: [kafkadata:/var/lib/kafka/data]
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 >/dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 20

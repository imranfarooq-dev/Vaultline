# =============================================================================
# Jenkins Configuration as Code (JCasC)
# Everything you would normally click together in "Manage Jenkins" lives here,
# so the whole CI server can be destroyed and recreated identically.
# ${VAR} values come from environment variables (see jenkins/docker-compose.yml).
# =============================================================================
jenkins:
  systemMessage: "NestBank CI/CD. Configured as code in jenkins/controller/casc.yaml"
  numExecutors: 0          # the controller never runs builds itself (security best practice)
  mode: EXCLUSIVE

  securityRealm:
    local:
      allowsSignup: false
      users:
        - id: "${JENKINS_ADMIN_ID}"
          password: "${JENKINS_ADMIN_PASSWORD}"

  authorizationStrategy:
    loggedInUsersCanDoAnything:
      allowAnonymousRead: false

  nodes:
    - permanent:
        name: "docker-agent"
        labelString: "docker nodejs terraform kubectl"
        remoteFS: "/home/jenkins/agent"
        numExecutors: 2
        mode: NORMAL
        retentionStrategy: "always"
        launcher:
          ssh:
            host: "jenkins-agent"
            port: 22
            credentialsId: "jenkins-agent-ssh"
            javaPath: "/opt/java/openjdk/bin/java"
            launchTimeoutSeconds: 120
            maxNumRetries: 30
            retryWaitTime: 10
            sshHostKeyVerificationStrategy: "nonVerifyingKeyVerificationStrategy"
        nodeProperties:
          - envVars:
              env:
                # SSH sessions don't inherit container env, so build variables are set on the node.
                - key: "TESTCONTAINERS_HOST_OVERRIDE"
                  value: "host.docker.internal"
                - key: "CI"
                  value: "true"

credentials:
  system:
    domainCredentials:
      - credentials:
          - basicSSHUserPrivateKey:
              scope: SYSTEM
              id: "jenkins-agent-ssh"
              username: "jenkins"
              description: "Controller -> agent SSH key (generated by the keygen service)"
              privateKeySource:
                directEntry:
                  privateKey: "${readFile:/run/jenkins-keys/id_rsa}"
          - aws:
              scope: GLOBAL
              id: "aws-nestbank"
              description: "AWS credentials for Terraform and EKS deploys"
              accessKey: "${AWS_ACCESS_KEY_ID}"
              secretKey: "${AWS_SECRET_ACCESS_KEY}"

# =============================================================================
# Jenkins for NestBank: controller + SSH build agent, configured entirely as code.
#
#   docker compose -f jenkins/docker-compose.yml up -d --build     (or: make jenkins-up)
#   open http://localhost:8090   user: admin   password: admin  (change in jenkins/.env)
#
#   ┌──────────────────────┐   SSH    ┌──────────────────────────────────────────┐
#   │ jenkins (controller) │ ───────▶ │ jenkins-agent                            │
#   │  UI, schedules jobs, │          │  node 22, docker CLI, kubectl, terraform,│
#   │  0 executors,        │          │  aws cli, kubeconform                    │
#   │  NO docker access    │          │  builds images & runs Testcontainers via │
#   └──────────────────────┘          │  the host Docker socket                  │
#                                     └──────────────────────────────────────────┘
# =============================================================================
name: nestbank-jenkins

services:
  # One-shot: creates the SSH key pair the controller uses to log in to the agent.
  keygen:
    image: alpine:3.20
    volumes: [agent_keys:/keys]
    command:
      - /bin/sh
      - -c
      - |
        if [ ! -f /keys/id_rsa ]; then
          apk add --no-cache openssh-keygen >/dev/null
          ssh-keygen -t rsa -b 4096 -m PEM -N "" -C jenkins-agent -f /keys/id_rsa
        fi
        chown -R 1000:1000 /keys && chmod 600 /keys/id_rsa && chmod 644 /keys/id_rsa.pub
        echo "agent keys ready"
    restart: "no"

  jenkins:
    build: ./controller
    image: nestbank/jenkins-controller:local
    ports: ["8090:8080"]
    environment:
      JENKINS_ADMIN_ID: ${JENKINS_ADMIN_ID:-admin}
      JENKINS_ADMIN_PASSWORD: ${JENKINS_ADMIN_PASSWORD:-admin}
      # The pipeline job checks out this repository. Default: the folder mounted below.
      NESTBANK_REPO_URL: ${NESTBANK_REPO_URL:-file:///repo}
      NESTBANK_REPO_BRANCH: ${NESTBANK_REPO_BRANCH:-*/main}
      # Placeholders keep configuration-as-code valid. Put real keys in jenkins/.env to deploy to AWS.
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-REPLACE_ME}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-REPLACE_ME}
    volumes:
      - jenkins_home:/var/jenkins_home
      - agent_keys:/run/jenkins-keys:ro
      - ..:/repo:ro                       # this repository, for file:///repo checkouts
    depends_on:
      keygen: { condition: service_completed_successfully }
    restart: unless-stopped

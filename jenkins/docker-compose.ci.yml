# =============================================================================
# Throwaway stack for the Jenkins "Smoke test" stage.
# Runs the image that was JUST built, with real Postgres and Kafka, then walks
# through all 23 patterns. The LLM is faked so the stage needs no 1.6 GB model.
#
#   IMAGE=nestbank/banking-api:<tag> docker compose -p ci-42 -f jenkins/docker-compose.ci.yml run --rm smoke
#   docker compose -p ci-42 -f jenkins/docker-compose.ci.yml down -v
#
# Nothing publishes ports, so parallel builds never collide.
# =============================================================================
x-app-env: &app-env
  DB_HOST: postgres
  DB_USER: bank
  DB_PASSWORD: bank_password
  DB_NAME: bank
  DB_RUN_MIGRATIONS: "false"
  KAFKA_ENABLED: "true"
  KAFKA_BROKERS: kafka:9092
  AI_PROVIDER: fake
  AI_AUTO_INGEST: "false"
  LOG_FORMAT: json

services:
  postgres:
    image: pgvector/pgvector:pg16
    environment: { POSTGRES_USER: bank, POSTGRES_PASSWORD: bank_password, POSTGRES_DB: bank }
    tmpfs: [/var/lib/postgresql/data]       # RAM-backed: fast and nothing left behind
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bank -d bank"]
      interval: 3s
      retries: 30

  kafka:
    image: apache/kafka:3.9.0
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 >/dev/null 2>&1"]
      interval: 5s
      retries: 30

  migrate:
    image: ${IMAGE:?set IMAGE to the image under test}
    environment: *app-env
    command: ["node", "dist/database/run-migrations.js"]
    depends_on:
      postgres: { condition: service_healthy }

  api:
    image: ${IMAGE:?set IMAGE to the image under test}
    environment: { <<: *app-env, APP_MODE: api, PORT: 3000 }
    depends_on:
      migrate: { condition: service_completed_successfully }
      kafka: { condition: service_healthy }
    # health check comes from the image's HEALTHCHECK instruction
